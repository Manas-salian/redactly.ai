[project]
name = "redactly-server"
version = "0.2.0"
description = "RedactLy V2 server — privacy-first PII redaction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1,<8.2",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.1,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary,pool]>=3.2,<3.3",
    "alembic>=1.14,<1.15",
    "celery[redis]>=5.4,<5.5",
    "redis>=5.2,<5.3",
    "argon2-cffi>=23.1,<24",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.20,<0.1",
    "structlog>=24.4,<25",
    "slowapi>=0.1.9,<0.2",
    "typer>=0.13,<0.14",
    "prometheus-client>=0.21,<0.22",
    "boto3>=1.35,<2",
    "pymupdf>=1.25,<1.26",
    "pytesseract>=0.3.13,<0.4",
    "pillow>=11.0,<12",
    "pillow-heif>=0.20,<0.21",
    "opencv-python-headless>=4.10,<5",
    "numpy>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
